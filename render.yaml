services:
  # The Celery consumer runs inside this same container via backend/start.sh
  # rather than as its own Render service. That began as a free-plan
  # constraint and is now a choice worth revisiting: on a paid plan a
  # separate background-worker service would mean one worker for the whole
  # cluster instead of one per instance, which is what autoscaling turns it
  # into.
  - type: web
    name: clardentity-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Standard ($25/mo), with autoscaling enabled on the dashboard. Written
    # here so a Blueprint sync cannot quietly put the service back on free
    # and reintroduce the spin-down - the same trap as the model pins below.
    # Autoscaling min/max instances live on the dashboard; Blueprint has no
    # field for them, so do not expect this file to carry them.
    plan: standard
    healthCheckPath: /health
    # Runs for real on a paid plan. backend/start.sh also migrates at boot,
    # which is deliberate belt-and-braces: alembic upgrade head is idempotent
    # and both paths take a Postgres advisory lock (alembic/env.py), so
    # several instances starting at once serialise instead of racing.
    preDeployCommand: alembic upgrade head
    envVars:
      - fromGroup: clardentity-shared

envVarGroups:
  - name: clardentity-shared
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      # gpt-5 is a heavy reasoning model and was the cause of ~30s responses;
      # the fix was applied on the dashboard and this file was left behind,
      # so a Blueprint sync would have quietly reinstated the slow model.
      # These three are latency-critical - keep them in step with the service.
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_FAST_MODEL
        value: gpt-5.4-nano
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_STT_MODEL
        value: whisper-1
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: alloy
      # Use Supabase's Supavisor transaction pooler (aws-N-<region>.pooler.supabase.com:6543,
      # user "postgres.<project-ref>"), not the direct db.<ref>.supabase.co:5432 host - the
      # latter is IPv6-only and unreachable from Render's IPv4-only egress.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: clardentity-prod
      - key: S3_REGION
        value: ap-northeast-2
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      # Per-container Postgres connections. What matters with autoscaling is
      # this times the instance count against the pooler's client limit, so
      # these stay small; raise them only alongside the database plan.
      # The admin dashboard: who may open it, and the account seeded at boot
      # when it is missing. The password is set on the dashboard only - it is
      # never in this file and never in git.
      - key: ADMIN_EMAILS
        value: admin@clardentity.ai
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@clardentity.ai
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      # Set on the service but missing here, which is the same trap as the
      # model pin above - a Blueprint sync would drop them back to the code
      # defaults in app/core/config.py, and those defaults are wrong for
      # production in ways that fail quietly rather than loudly:
      #   APP_URL      -> http://localhost:3000, so every password-reset link
      #                   we email would point at the recipient's own machine
      #   EMAIL_FROM   -> onboarding@resend.dev, off-domain
      #   RESEND_API_KEY unset -> email silently disabled, by design
      #   GOOGLE_CLIENT_ID unset -> Google sign-in stops working
      - key: APP_URL
        value: https://clardentity.ai
      - key: EMAIL_FROM
        value: Clardentity <hello@clardentity.ai>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The iOS and Android apps' own OAuth client IDs, comma-separated. A
      # token from the app names its own client as the audience, so without
      # these the server refuses every phone sign-in as an invalid token.
      - key: GOOGLE_CLIENT_IDS_EXTRA
        sync: false
