# The backend's pytest suite on every push and pull request.
#
# The tests existed (40 files) but nothing ran them: they need a Postgres
# with pgvector and a Redis, and a test that finds neither skips itself, so a
# laptop without them "passes" by running half the suite. Here both are real
# services, the schema comes from the same migrations a deploy applies, and a
# skipped database test is a missing service, not a pass.
#
# No real provider keys: every model call in the suite is faked. The dummy
# values only satisfy settings that are required at import time.
name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clardentity
          POSTGRES_PASSWORD: clardentity_test_pw
          POSTGRES_DB: clardentity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clardentity"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://clardentity:clardentity_test_pw@localhost:5432/clardentity
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-not-a-real-key
      JWT_SECRET: ci-only-not-a-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The Dockerfile's version, so CI and production agree.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q -rs
