# Optional containerized local stack — kept for parity with the eventual
# cloud deployment shape (Postgres+pgvector / Redis / S3-compatible storage).
#
# Day-to-day local dev on this machine runs these natively via Homebrew
# instead (see root README.md) since Docker isn't installed here. This file
# is provided for anyone who prefers containers, or as a reference for CI.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clardentity
      POSTGRES_PASSWORD: clardentity_dev_pw
      POSTGRES_DB: clardentity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clardentity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/clardentity-dev &&
      exit 0
      "

  backend:
    build: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://clardentity:clardentity_dev_pw@postgres:5432/clardentity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://clardentity:clardentity_dev_pw@postgres:5432/clardentity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info

volumes:
  pgdata:
  miniodata:
